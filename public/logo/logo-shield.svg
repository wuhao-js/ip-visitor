<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shieldG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#bg2)"/>

  <!-- 盾牌轮廓 -->
  <path d="M100 30 L148 48 L148 96 C148 130 126 156 100 168 C74 156 52 130 52 96 L52 48 Z"
        fill="url(#shieldG)" opacity="0.15" stroke="#38bdf8" stroke-width="2"/>

  <!-- 盾牌内部：IP 数据网格 -->
  <g transform="translate(72 68)" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
    <!-- 脉冲波形 -->
    <path d="M0 40 L12 40 L18 20 L26 60 L34 10 L44 50 L56 30 L56 40" stroke-width="2"/>
    <!-- 数据点 -->
    <circle cx="18" cy="20" r="3" fill="#38bdf8" stroke="none"/>
    <circle cx="26" cy="60" r="3" fill="#38bdf8" stroke="none"/>
    <circle cx="34" cy="10" r="3" fill="#fbbf24" stroke="none"/>
  </g>

  <!-- 顶部 IP 字符标识 -->
  <g transform="translate(100 55)" text-anchor="middle" font-family="'SF Mono', Consolas, monospace">
    <text font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="2">IP</text>
  </g>

  <!-- 文字 -->
  <g text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="100" y="182" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="6">来路</text>
  </g>
</svg>
