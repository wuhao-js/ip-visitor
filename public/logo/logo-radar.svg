<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#bg)"/>

  <!-- 雷达同心圆 -->
  <g transform="translate(100 110)" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5">
    <circle r="48"/>
    <circle r="34"/>
    <circle r="20"/>
    <!-- 十字线 -->
    <line x1="-55" y1="0" x2="55" y2="0"/>
    <line x1="0" y1="-55" x2="0" y2="55"/>
  </g>

  <!-- 扫描光束 -->
  <g transform="translate(100 110)">
    <path d="M0,0 L42,-42 A60,60 0 0,1 0,-60 Z" fill="url(#sweep)" opacity="0.75"/>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#67e8f9" stroke-width="1.5" opacity="0.9"/>
  </g>

  <!-- 亮点节点（来访IP） -->
  <g transform="translate(100 110)">
    <circle cx="-22" cy="-28" r="3.5" fill="#fbbf24">
      <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="12" r="3" fill="#34d399">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="-10" cy="38" r="2.5" fill="#f472b6">
      <animate attributeName="r" values="2;3.5;2" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <!-- 中心圆点 -->
  <circle cx="100" cy="110" r="4" fill="#ffffff"/>
  <circle cx="100" cy="110" r="7" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- 底部文字区 -->
  <g text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="100" y="58" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="2">来路</text>
    <text x="100" y="78" font-size="11" fill="rgba(255,255,255,0.7)" letter-spacing="4">LAILU</text>
  </g>
</svg>
