<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>来路 · 登录</title>
<link rel="icon" type="image/svg+xml" href="/logo/icon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    color: #17212f; background:
      radial-gradient(circle at 12% 18%, rgba(37,99,235,.16), transparent 34%),
      radial-gradient(circle at 88% 82%, rgba(16,24,39,.14), transparent 38%),
      linear-gradient(135deg, #f5f8ff, #eef3fa);
  }
  .card {
    width: 400px; padding: 38px 34px; border: 1px solid #e3e9f2;
    border-radius: 18px; background: rgba(255,255,255,.92);
    box-shadow: 0 20px 60px rgba(15,32,61,.12); backdrop-filter: blur(12px);
  }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .logo-img { width: 42px; height: 42px; border-radius: 12px; }
  .logo span:first-child {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px;
    color: #fff; background: linear-gradient(135deg, #3b82f6, #2563eb);
    font-size: 15px; font-weight: 800; letter-spacing: -1px;
  }
  h1 { font-size: 20px; }
  p.sub { color: #67748b; font-size: 13px; margin-top: 3px; }
  label { display: grid; gap: 6px; margin-bottom: 14px; color: #67748b; font-size: 12px; font-weight: 600; }
  input[type=password], input[type=text] {
    width: 100%; min-height: 40px; padding: 9px 11px; border: 1px solid #ccd5e3;
    border-radius: 9px; color: #17212f; font-size: 14px; outline: none; transition: .18s;
  }
  input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.13); }
  button {
    width: 100%; margin-top: 6px; padding: 10px; border: 0; border-radius: 9px;
    background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #93b2f2; cursor: not-allowed; }
  .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 12px; text-align: center; }
  .hint { padding-top: 12px; border-top: 1px solid #e9eef6; color: #67748b; font-size: 12px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span>来</span><div><h1>来路</h1><p class="sub">LaiLu · 知道来路，才好应对</p></div></div>
  <form id="f">
    <label>账号<input id="user" type="text" placeholder="输入账号" autocomplete="username" autofocus></label>
    <label>密码<input id="pw" type="password" placeholder="输入密码" autocomplete="current-password"></label>
    <button id="btn" type="submit">登 录</button>
    <div class="err" id="err"></div>
  </form>
  <p class="hint">初始账号 admin / admin123，登录后请在「账号」页修改密码</p>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: document.getElementById('user').value.trim(), password: document.getElementById('pw').value }),
    });
    if (r.ok) { location.href = '/'; return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = j.error || ('登录失败 (' + r.status + ')');
  } catch (_e) {
    err.textContent = '网络错误';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
